[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitmyner"
version = "0.6.0"
description = "NOEMA × DNCrypt × GREMLIN CPU SHA256d engine with exact tau jitter and marker-graph research layer"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
bitmyner = "bitmyner.cli:main"

[tool.setuptools]
packages = ["bitmyner"]
