[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-myner"
version = "0.2.0"
description = "NOEMA × PhaseNav × DNCrypt × GREMLIN adaptive Bitcoin SHA256d miner"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
bitmyner = "bitmyner.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bitmyner*"]
