[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitmyner"
version = "0.4.0"
description = "NOEMA × DNCrypt × GREMLIN CPU SHA256d mining engine with exact tau jitter modulation"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bitmyner = "bitmyner.cli:main"

[tool.setuptools]
packages = ["bitmyner"]
