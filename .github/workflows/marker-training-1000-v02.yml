name: Marker Training 1000 v0.2

on:
  push:
    branches:
      - exp/marker-training-1000-v0.2
    paths:
      - .github/workflows/marker-training-1000-v02.yml
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Pre-training regression gate
        run: pytest -q tests/test_marker_training.py tests/test_marker_training_v2.py tests/test_marker_v02_spec.py
      - name: Run frozen 1000-iteration v0.2 training
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bitmyner.marker_training_v2 import run_training_1000_v2

          result = run_training_1000_v2(
              iterations=1000,
              header_count=100,
              nonces_per_header=128,
              thresholds=(4, 6, 8),
              population_size=64,
              offspring_per_iteration=8,
              max_predicates=3,
              seed=616,
              split_seed='bitmyner-marker-training-v0.1',
              checkpoint_every=100,
              cohort_count=4,
              cohort_refresh_every=25,
          )
          Path('MARKER_TRAINING_1000_V0_2.json').write_text(json.dumps(result, indent=2) + '\n')
          summary = {
              'status': result['status'],
              'receipt_blake2b256': result['receipt_blake2b256'],
              'promoted_count': result['promoted_count'],
              'unique_genomes_evaluated': result['search']['unique_genomes_evaluated'],
              'duplicate_proposals': result['search']['duplicate_proposals'],
              'duplicate_proposal_fraction': result['search']['duplicate_proposal_fraction'],
              'cohort_refreshes': result['search']['cohort_refreshes'],
              'final_champion': result['checkpoints'][-1]['champion_genome'],
              'final_train_score': result['checkpoints'][-1]['train_score'],
              'final_robust_core': result['checkpoints'][-1]['robust_core'],
          }
          print(json.dumps(summary, indent=2))
          if result['status'] != 'PASS_TRAINING_COMPLETE':
              raise SystemExit(4)
          PY
      - name: Upload 1000-iteration receipt
        uses: actions/upload-artifact@v4
        with:
          name: marker-training-1000-v02
          path: MARKER_TRAINING_1000_V0_2.json
          if-no-files-found: error
