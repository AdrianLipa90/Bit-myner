name: Bit-myner CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgomp1 libssl-dev
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Python compile gate
        run: python -m compileall -q bitmyner tests
      - name: Test
        run: pytest -q
