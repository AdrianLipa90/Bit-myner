name: Marker Nested Crossfit v0.11

on:
  push:
    branches:
      - exp/marker-training-v0.11-crossfold
    paths:
      - bitmyner/marker_training_v4.py
      - bitmyner/marker_training_v11.py
      - bitmyner/cli.py
      - tests/test_marker_training_v4.py
      - tests/test_marker_training_v10.py
      - tests/test_marker_training_v11.py
      - .github/workflows/marker-nested-v11.yml
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Regression gate
        run: pytest -q tests/test_marker_training_v11.py tests/test_marker_training_v10.py tests/test_marker_training_v4.py tests/test_structural_marker_v4.py
      - name: Run 3 x 1000 power-aware nested crossfit training
        run: |
          python -m bitmyner marker-train-v11 \
            --iterations 1000 \
            --headers 160 \
            --nonces-per-header 128 \
            --thresholds 4,6,8 \
            --seeds 4040,4141,4242 \
            --population 64 \
            --offspring 8 \
            --max-predicates 3 \
            --discovery-fraction 0.72 \
            --max-cohorts 4 \
            --min-expected-events-per-cohort 8 \
            --output MARKER_NESTED_CROSSFIT_V0_11_3X1000.json
      - uses: actions/upload-artifact@v4
        with:
          name: marker-nested-v011-3x1000
          path: MARKER_NESTED_CROSSFIT_V0_11_3X1000.json
          if-no-files-found: error
